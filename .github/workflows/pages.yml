name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/pali-rebuild-map-h3kks3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages has not been enabled for this repository yet. After enabling
    # Settings → Pages → Source: GitHub Actions, set DEPLOY_PAGES=true in
    # Settings → Secrets and variables → Actions → Variables.
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repository (it is a static site at the root).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
